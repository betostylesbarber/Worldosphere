<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ws.css"></head><body><div class="stage">
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0"></svg>
<div id="c1" class="f1 on" style="left:120px;top:470px;opacity:0">STREET</div><div id="c2" class="f1" style="left:700px;top:520px;opacity:0">ALLEY</div>
<div class="lane" style="top:1150px"><div id="cap" class="n1" style="opacity:0"></div></div>
<div class="g1" style="top:1820px;left:72px;color:rgba(242,235,221,.45)">MOTION PROOF · WS-001 FORK + BREATH EMITTER · PROTOTYPE</div>
</div>
<script src="../ws_draw.js"></script>
<script>
const svg=document.getElementById('s');
const k=Math.tan(12*Math.PI/180), xAt=y=>540+(960-y)*k;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function puffT(t,period,offset){const u=((t+offset)%period)/period*period; return u/0.7;}
function street(g,t,walk){
  nightStreet(g,{horizon:900}); el('rect',{x:0,y:0,width:1080,height:1920,fill:'#F5A524',opacity:0.10},g);
  streetlight(g,170,1330,640,320); streetlight(g,430,1280,560,260); streetlight(g,880,1300,600,280);
  [[120,1350,420,'#2f6d3a','#9fd18b',0.0],[300,1330,400,'#f4f1ea','#9fd18b',0.9],[230,1250,300,'#3a2a4a',null,0.4],[420,1300,360,'#7a2a2a',null,1.3],[700,1320,400,'#3b5a7a',null,0.6],[860,1290,340,'#5a3b2a','#9fd18b',1.1]].forEach(([x,y,h,top,paint,off],i)=>{
    const bob=Math.sin((t+off)*4)*4;
    const r=character(g,{x,y:y+bob,h,skin:['#D9A47A','#A86F4C','#F1C9A5','#6B4430','#D9A47A','#A86F4C'][i],paint,top,bottom:'#2a2236',shoe:'#222',facing:i%2?-1:1,face:{brows:'up',mouth:i%2?'smile':'o'}});
    breathPuff(g,r.mouth[0],r.mouth[1],puffT(t,1.6,off),1.0);});
  const kx=250+walk*160;
  const kai=character(g,{x:kx,y:1460,h:520,skin:'#A86F4C',top:'#F2C230',bottom:'#3b3f47',shoe:'#f2f2f2',face:{brows:'worried',mouth:'tight'},hairBack:KIT.kaiHair.hairBack,hairFront:KIT.kaiHair.hairFront,extra:KIT.headphones,arms:{l:[20,10],r:[-20,-8]},legs:{l:[8+Math.sin(t*6)*10*walk,-4],r:[-8-Math.sin(t*6)*10*walk,4]}});
  breathPuff(g,kai.mouth[0],kai.mouth[1],puffT(t,1.3,0.2),1.3);
  const mia=character(g,{x:kx-160,y:1420,h:380,skin:'#A86F4C',top:'#eef3f6',bottom:'#eef3f6',shoe:'#e5c64a',face:{brows:'worried',mouth:'rest'},hairFront:KIT.helmet(Math.max(0,1-puffT(t,1.1,0.5)*0.9)),legs:{l:[8+Math.sin(t*6+1)*10*walk,-4],r:[-8-Math.sin(t*6+1)*10*walk,4]}});
}
function alley(g){
  el('rect',{x:0,y:0,width:1080,height:1920,fill:'#0f1a20'},g);
  el('polygon',{points:'560,0 1080,0 1080,1920 760,1920 820,1100 700,1100',fill:'#1b2a31'},g);
  el('polygon',{points:'600,1100 1080,1100 1080,1920 520,1920',fill:'#141f25'},g);
  el('rect',{x:850,y:900,width:210,height:180,rx:10,fill:'#22323a',stroke:'#161A22','stroke-width':6},g);
  el('rect',{x:830,y:880,width:250,height:30,rx:6,fill:'#2b3d46',stroke:'#161A22','stroke-width':6},g);
  el('ellipse',{cx:735,cy:840,rx:22,ry:60,fill:'#0b1216',opacity:.9,filter:'url(#blur6)'},g);
  el('circle',{cx:735,cy:770,r:20,fill:'#0b1216',opacity:.9,filter:'url(#blur6)'},g);
  el('rect',{x:0,y:0,width:1080,height:1920,fill:'#1F3A44',opacity:.25},g);
}
window.renderFrame=function(t){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const d=defs(svg);
  const T0=1.2, Tsplit=T0+4/24, Tchoose=2.7, Twipe=8/24;
  const frozen = t>=T0 && t<Tchoose+Twipe; const st = frozen? T0 : t;          // freeze street animation during the Fork
  const walk = t>Tchoose+Twipe ? (t-(Tchoose+Twipe))/1.8 : 0;
  // gap and wipe progress
  const g1 = ease((t-T0)/(4/24)), gap = 14*ease((t-Tsplit)/(6/24)), w = ease((t-Tchoose)/Twipe);
  if (t < T0) { const g=el('g',{},svg); street(g,t,0); }
  else {
    if (w<1) { const base=el('g',{},svg); street(base,st,walk); }   // frozen base under the incoming panels (no bare-ink flash)
    // left (chosen) clip expands to full frame during wipe
    const shift = w*1100;
    const cl=el('clipPath',{id:'L'},d); el('polygon',{points:`0,0 ${xAt(0)-gap+shift},0 ${xAt(1920)-gap+shift},1920 0,1920`},cl);
    const L=el('g',{'clip-path':'url(#L)'},svg); street(L,st,walk);
    if (w<1) { const cr=el('clipPath',{id:'R'},d); el('polygon',{points:`${xAt(0)+gap+shift},0 1180,0 1180,1920 ${xAt(1920)+gap+shift},1920`},cr);
      const Rg=el('g',{'clip-path':'url(#R)',transform:`translate(${shift*0.6},0)`,opacity:g1*(1-0.5*w)},svg); alley(Rg);
      if (w>0) el('rect',{x:0,y:0,width:1080,height:1920,fill:'#808080',opacity:0.0},Rg);
      // crack draws in top->bottom over 4 frames, glows
      const len=1960, drawn=len*g1;
      el('line',{x1:xAt(0)+shift,y1:0,x2:xAt(1920)+shift,y2:1920,stroke:'#F5A524','stroke-width':26,opacity:.35*(1-w),filter:'url(#blur6)','stroke-dasharray':`${drawn} ${len}`},svg);
      el('line',{x1:xAt(0)+shift,y1:0,x2:xAt(1920)+shift,y2:1920,stroke:'#F5A524','stroke-width':8,opacity:1-w,'stroke-dasharray':`${drawn} ${len}`},svg);
    }
  }
  el('rect',{x:0,y:0,width:1080,height:1920,filter:'url(#grain)'},svg);
  // chips slide in from panel edges (4 frames) after the split, and leave with the wipe
  const cin=ease((t-(Tsplit+2/24))/(4/24)), cout=ease((t-Tchoose)/Twipe);
  const c1=document.getElementById('c1'), c2=document.getElementById('c2');
  c1.style.opacity = cin*(1-cout); c1.style.transform=`translateX(${(1-cin)*-60}px)`;
  c2.style.opacity = cin*(1-cout); c2.style.transform=`translateX(${(1-cin)*60 + cout*300}px)`;
  const cap=document.getElementById('cap');
  const caps=[[1.25,2.15,'In the dark,'],[2.17,3.1,"you can't see<br>what's coming."],[3.12,4.95,'Kai took the <span class="amb">light</span>.']];
  const c=caps.find(([a,b])=>t>=a&&t<b); cap.style.opacity=c?Math.min(1,(t-c[0])/(2/24)):0; cap.innerHTML=c?c[2]:'';
};
window.renderFrame(0);
</script></body></html>
